<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIlesson 后台</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f7f9;
  --panel: #fff;
  --line: #e3e6ea;
  --ink: #1b1f24;
  --dim: #6b7280;
  --accent: #2563eb;
  --ok: #15803d;
  --warn: #b45309;
  --bad: #b91c1c;
  --okbg: #f0fdf4;
  --badbg: #fef2f2;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
}
header {
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 0 20px; display: flex; align-items: center; gap: 20px;
  position: sticky; top: 0; z-index: 10;
}
header h1 { font-size: 15px; margin: 0; padding: 14px 0; font-weight: 600; }
header h1 span { color: var(--dim); font-weight: 400; }
nav { display: flex; gap: 2px; }
nav button {
  border: 0; background: none; padding: 14px 14px 12px;
  border-bottom: 2px solid transparent; cursor: pointer;
  font: inherit; color: var(--dim);
}
nav button.on { color: var(--accent); border-bottom-color: var(--accent); }
nav button:hover { color: var(--ink); }
nav button { font-weight: 500; }
.head-right { margin-left: auto; color: var(--dim); font-size: 13px; }
/* 二级导航：当前后台里的页面。只有一页时整条收起 */
#sub {
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 0 20px; display: flex; gap: 16px;
  position: sticky; top: 47px; z-index: 9;
}
#sub.empty-row { display: none; }
#sub button {
  border: 0; background: none; padding: 9px 0; cursor: pointer;
  font: inherit; font-size: 13px; color: var(--dim);
  border-bottom: 2px solid transparent;
}
#sub button.on { color: var(--ink); border-bottom-color: var(--ink); }
#sub button:hover { color: var(--ink); }
main { padding: 20px; max-width: 1400px; margin: 0 auto; }
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 16px; margin-bottom: 16px;
}
.panel > h2 {
  font-size: 14px; margin: 0 0 4px; font-weight: 600;
}
.panel > .sub { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td {
  text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line);
  vertical-align: top;
}
th { color: var(--dim); font-weight: 500; white-space: nowrap; }
tbody tr:hover { background: #fafbfc; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
code {
  font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  background: #f1f3f5; padding: 1px 5px; border-radius: 3px; color: #475569;
}
.tag {
  display: inline-block; padding: 1px 7px; border-radius: 10px;
  font-size: 12px; background: #eef2f7; color: #475569; white-space: nowrap;
}
.tag.ok { background: var(--okbg); color: var(--ok); }
.tag.bad { background: var(--badbg); color: var(--bad); }
.tag.warn { background: #fffbeb; color: var(--warn); }
.dim { color: var(--dim); }
.bar { height: 6px; background: #eceff3; border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); }
.bar.has-gap > i { background: var(--warn); }
.bar.neutral > i { background: #94a3b8; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.stat { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat.bad { color: var(--bad); }
.stat small { font-size: 13px; font-weight: 400; color: var(--dim); }
button.act {
  border: 1px solid var(--line); background: #fff; border-radius: 6px;
  padding: 5px 11px; cursor: pointer; font: inherit; color: var(--ink);
}
button.act:hover { border-color: var(--accent); color: var(--accent); }
button.act.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note {
  background: #f8fafc; border-left: 3px solid var(--line);
  padding: 8px 12px; margin: 10px 0; color: var(--dim); font-size: 13px;
}
.note.bad { border-left-color: var(--bad); background: var(--badbg); color: #7f1d1d; }
details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
.empty { color: var(--dim); padding: 24px; text-align: center; }
.step-list { display: flex; flex-direction: column; gap: 0; }
.step {
  display: grid; grid-template-columns: 34px 1fr auto;
  gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line);
  align-items: baseline;
}
.step:last-child { border-bottom: 0; }
.step .idx {
  color: var(--dim); font-variant-numeric: tabular-nums; text-align: right;
}
.step .ttl { font-weight: 500; }
.step .meta { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
</style>
</head>
<body>
<header>
  <h1>AIlesson <span>后台</span></h1>
  <nav id="nav"></nav>
  <div class="head-right" id="head-right"></div>
</header>
<div id="sub"></div>
<main id="app"><div class="empty">加载中…</div></main>
<script src="/admin/admin.js"></script>
</body>
</html>
