<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AIlesson · Muddy Puddles</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card2: #21252e;
    --line: #2c313c;
    --fg: #e8eaed;
    --dim: #9aa0ac;
    --accent: #5b8cff;
    --ok: #34c759;
    --bad: #ff5f56;
    --warn: #ffb340;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; justify-content: center; min-height: 100vh;
  }
  #app { width: 100%; max-width: 480px; padding: 16px 16px 40px; }
body.checking #app { padding-bottom: 120px; }   /* 给底部固定条留位，别压住词卡 */

  h1 { font-size: 20px; margin: 4px 0 2px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .dim { color: var(--dim); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }

  button {
    font: inherit; color: var(--fg); background: var(--card2);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 16px; cursor: pointer; transition: .12s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  button.wide { width: 100%; }
  button.ghost { background: transparent; }
  button.big { padding: 16px; font-size: 16px; }

  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 14px; padding: 16px; margin-bottom: 12px; }

  /* 顶部进度 */
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 10px 0 14px; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }

  .seg { font-size: 12px; color: var(--dim); letter-spacing: .3px; }
  .seg b { color: var(--accent); font-weight: 600; }

  /* 播音按钮 */
  .play {
    width: 100%; padding: 26px; font-size: 17px; font-weight: 600;
    background: linear-gradient(180deg, #2b3242, #232833);
    border: 1px solid var(--line); border-radius: 14px;
  }
  .play.small { padding: 14px; font-size: 15px; }
  .play.is-playing { border-color: var(--accent); background: #2a3550; }

  /* 选项网格 */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .opt {
    position: relative; padding: 0; overflow: hidden; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    background: var(--card2); border: 2px solid var(--line); border-radius: 12px;
  }
  .opt img { width: 100%; height: 100%; object-fit: cover; }
  .opt.audio { aspect-ratio: auto; padding: 20px 12px; font-size: 14px; }
  .opt.right { border-color: var(--ok); }
  .opt.wrong { border-color: var(--bad); opacity: .6; }
  .opt.faded { opacity: .25; pointer-events: none; }
  .opt .zh {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 4px;
    background: rgba(0,0,0,.72); font-size: 12px;
  }

  /* 反馈条 */
  .fb { margin-top: 12px; padding: 12px 14px; border-radius: 10px;
        border-left: 3px solid var(--line); background: var(--card2); font-size: 14px; }
  .fb.ok { border-left-color: var(--ok); }
  .fb.bad { border-left-color: var(--bad); }
  .fb .tutor { color: var(--dim); font-size: 13px; margin-top: 6px; min-height: 18px; }

  /* 用户 */
  .ubar { display: flex; justify-content: space-between; align-items: center;
          padding: 8px 12px; margin-bottom: 12px; border-radius: 10px;
          background: var(--card); border: 1px solid var(--line); font-size: 13px; }
  .ubar .who { font-weight: 600; }
  .lesson.cur { border-color: var(--accent); }
  button.danger { color: var(--bad); border-color: #4a2a2a; }
  button.danger:hover { border-color: var(--bad); }
  .inp { flex: 1; font: inherit; color: var(--fg); background: var(--card2);
         border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; }
  .inp:focus { outline: none; border-color: var(--accent); }

  /* 三层切页 */
  .tabs { display: flex; gap: 6px; margin: 14px 0 4px; }
  .tab { flex: 1; padding: 9px 6px; font-size: 14px; border-radius: 10px;
         display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tab.on { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .tab .cnt { font-size: 11px; opacity: .75; }

  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: right; font-weight: 500; color: var(--dim);
            font-size: 12px; padding: 2px 8px; }
  .tbl th:first-child { text-align: left; }
  .tbl td { text-align: right; padding: 3px 8px; }
  .tbl td:first-child { text-align: left; color: var(--dim); }
  .tbl td.ok { color: var(--ok); }
  .tbl td.bad { color: var(--warn); }

  /* 清单勾选 */
  .grp-head { display: flex; justify-content: space-between; align-items: center;
              margin: 18px 0 8px; font-weight: 600; font-size: 14px; }
  .wlist { display: flex; flex-direction: column; gap: 8px; }
  .lemma.sm { font-size: 14px; font-weight: 500; line-height: 1.4; }
  .olist { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .opt.text { aspect-ratio: auto; padding: 13px 14px; text-align: left;
              justify-content: flex-start; }
  .zh3 { font-size: 14px; }
  .words.q { color: #8d94a3; }
  button.mini { padding: 4px 10px; font-size: 12px; border-radius: 14px; }
  .wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .wcard {
    position: relative; padding: 10px 12px; border-radius: 10px; cursor: pointer;
    background: var(--card); border: 1.5px solid var(--line); transition: .1s;
  }
  .wcard:hover { border-color: #414958; }
  .wcard.on { background: #17301f; border-color: var(--ok); }
  .wcard .wtop { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .wcard .lemma { font-size: 16px; font-weight: 600; letter-spacing: .2px; }
  .wcard.on .lemma { color: var(--ok); }
  .wcard .zh2 { font-size: 12px; color: var(--dim); margin-top: 1px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wcard .spk { font-size: 14px; opacity: .5; padding: 2px 4px; }
  .wcard .spk:hover { opacity: 1; }
  .wcard .tick { position: absolute; right: 8px; bottom: 6px; color: var(--ok);
                 font-size: 13px; opacity: 0; transition: .1s; }
  .wcard.on .tick { opacity: 1; }

  /* 固定在视口底部，不参与文档流 —— sticky 在长列表里会压住内容 */
  .sticky {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
    width: 100%; max-width: 480px; padding: 14px 16px 16px;
    background: var(--bg); border-top: 1px solid var(--line); z-index: 10;
  }

  /* 课程列表 */
  .lesson { display: flex; gap: 10px; align-items: center; padding: 12px;
            background: var(--card2); border: 1px solid var(--line);
            border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
  .lesson:hover { border-color: var(--accent); }
  .lesson .n { width: 30px; height: 30px; flex: none; border-radius: 50%;
               background: var(--line); display: flex; align-items: center;
               justify-content: center; font-size: 13px; font-weight: 600; }
  .lesson.done .n { background: var(--ok); }
  .lesson .body { flex: 1; min-width: 0; }
  .lesson .theme { font-weight: 600; margin-bottom: 2px; }
  .lesson .words { font-size: 12px; color: var(--dim);
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 20px;
          background: var(--card2); border: 1px solid var(--line); }
  .chip.ok { border-color: var(--ok); color: var(--ok); }
  .chip.bad { border-color: var(--bad); color: var(--bad); }

  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line);
          border-top-color: var(--accent); border-radius: 50%; animation: s .7s linear infinite;
          vertical-align: -2px; }
  @keyframes s { to { transform: rotate(360deg) } }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
           background: #2b3242; border: 1px solid var(--line); padding: 10px 18px;
           border-radius: 22px; opacity: 0; transition: .2s; pointer-events: none; font-size: 14px; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  pre.report { white-space: pre-wrap; font: inherit; margin: 0; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<audio id="au"></audio>
<script src="/app.js"></script>
</body>
</html>
