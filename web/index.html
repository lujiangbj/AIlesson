<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e8a94b'/><path d='M12 9.5v13l11-6.5z' fill='%232a1c05'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>AIlesson · Muddy Puddles</title>
<style>
  /* ============================================================
     AIlesson 设计系统
     中性深底 + 琥珀品牌色（主行动/进度）+ 绿/红状态色（对错）。
     颜色让位给内容（影视剧照），UI 退后。
     教室 = 恒定框架（cls-top / cls-progress / cls-stage / cls-dock）
           + 可插拔卡型（CARDS 注册表，见 app.js）。
     ============================================================ */
  :root {
    --bg: #14161b;
    --bg-2: #0f1115;
    --card: #1c1f26;
    --card2: #242832;
    --line: rgba(255,255,255,.09);
    --line-2: rgba(255,255,255,.15);
    --fg: #f2f4f7;
    --dim: #9ba3b4;
    --faint: #6d7484;
    --brand: #e8a94b;
    --brand-2: #f4bd6b;
    --brand-ink: #2a1c05;
    --ok: #4ecb6d;
    --ok-ink: #0d2b16;
    --bad: #ff7364;
    --bad-ink: #33100b;
    --warn: #f2b84b;
    --r-s: 10px; --r-m: 14px; --r-l: 20px;
    --ease: cubic-bezier(.2,.8,.2,1);
    --font: "Nunito", -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scrollbar-color: var(--line-2) transparent; }
  body {
    margin: 0; color: var(--fg); background: var(--bg);
    font: 15px/1.6 var(--font);
    display: flex; justify-content: center; min-height: 100vh;
  }
  ::selection { background: rgba(232,169,75,.35); }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 5px; border: 2px solid var(--bg); }

  #app { width: 100%; max-width: 520px; padding: 18px 16px 48px; }
  body.checking #app { padding-bottom: 120px; }   /* 给底部固定条留位，别压住词卡 */

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

  h1 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; margin: 4px 0; }
  h2 {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--dim);
    margin: 0 0 12px; text-transform: uppercase;
  }
  h2::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
  .eyebrow {
    font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase;
    color: var(--brand); margin-bottom: 8px;
  }
  .hero { padding: 8px 2px 2px; }
  .hero h1 { font-size: 28px; margin: 0 0 6px; }
  .dim { color: var(--dim); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }

  /* ---------- 按钮 ---------- */
  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font: inherit; font-weight: 700; color: var(--fg);
    background: var(--card2);
    border: 1px solid var(--line-2); border-radius: 12px;
    padding: 11px 16px; cursor: pointer;
    transition: border-color .15s, box-shadow .15s, transform .15s, background .15s, opacity .15s;
  }
  button:hover:not(:disabled) { border-color: rgba(232,169,75,.55); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary {
    background: linear-gradient(180deg, var(--brand-2), var(--brand));
    color: var(--brand-ink); border-color: transparent; font-weight: 800;
    box-shadow: 0 4px 16px rgba(232,169,75,.25), inset 0 1px 0 rgba(255,255,255,.3);
  }
  button.primary:hover:not(:disabled) {
    border-color: transparent;
    box-shadow: 0 7px 24px rgba(232,169,75,.35), inset 0 1px 0 rgba(255,255,255,.3);
  }
  button.wide { width: 100%; }
  button.ghost { background: transparent; }
  button.big { padding: 14px 18px; font-size: 16px; border-radius: var(--r-m); }
  button.mini { padding: 4px 12px; font-size: 12px; border-radius: 999px; }
  button.danger { color: var(--bad); border-color: rgba(255,115,100,.3); }
  button.danger:hover { border-color: var(--bad); }
  button .ic { width: 17px; height: 17px; flex: none; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l);
    padding: 18px; margin-bottom: 14px;
    animation: rise .28s var(--ease) both;
  }

  .inp {
    flex: 1; font: inherit; color: var(--fg); background: var(--card2);
    border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 14px;
  }
  .inp:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(232,169,75,.18); }

  /* ---------- 用户条 ---------- */
  .ubar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 6px 6px 8px; margin-bottom: 18px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); font-size: 13px;
  }
  .ubar .who { display: flex; align-items: center; gap: 9px; font-weight: 800; }
  .ubar .ava {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--brand-2), var(--brand));
    color: var(--brand-ink); font-weight: 800; font-size: 13px;
  }

  /* ---------- 播音按钮 ---------- */
  .play {
    width: 100%; padding: 22px; font-size: 16px; font-weight: 800;
    color: var(--brand-2);
    background: rgba(232,169,75,.08);
    border: 1.5px solid rgba(232,169,75,.4); border-radius: var(--r-m);
  }
  .play .ic { width: 19px; height: 19px; }
  .play:hover:not(:disabled) { border-color: var(--brand); background: rgba(232,169,75,.14); }
  .play.small { padding: 14px; font-size: 14px; }
  .play.is-playing {
    background: linear-gradient(180deg, var(--brand-2), var(--brand));
    color: var(--brand-ink); border-color: transparent;
  }
  /* 播放中声波跳动 */
  .is-playing .ic .w1 { animation: wave 1s ease-in-out infinite; }
  .is-playing .ic .w2 { animation: wave 1s .18s ease-in-out infinite; }
  @keyframes wave { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

  /* 听力测试的大圆盘播放钮 */
  .disc {
    width: 108px; height: 108px; border-radius: 50%; padding: 0; margin: 18px auto 12px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--brand-2), var(--brand));
    color: var(--brand-ink); border: none;
    box-shadow: 0 10px 30px rgba(232,169,75,.3), inset 0 2px 0 rgba(255,255,255,.3);
  }
  .disc .ic { width: 38px; height: 38px; }
  .disc:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(232,169,75,.4); }

  /* ---------- 选项（图片格 + 文字行） ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt {
    position: relative; padding: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: var(--card2); border: 2px solid var(--line); border-radius: var(--r-m);
    transition: border-color .15s, background .15s, transform .15s, opacity .15s;
  }
  .opt:hover:not(:disabled) { border-color: rgba(232,169,75,.55); transform: translateY(-1px); }
  /* 选项图是题干本身，必须完整展示：选项格在横屏课堂里会被拉成宽矩形，
     cover 会把方形图裁掉上下边（答案图被裁 = 题目坏了） */
  .opt img { width: 100%; height: 100%; object-fit: contain; }
  .opt .opt-play {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; color: var(--fg);
    background: rgba(0,0,0,.35); border: 1px solid var(--line-2); transition: .12s;
  }
  .opt .opt-play .ic { width: 19px; height: 19px; }
  .opt .opt-play:hover { border-color: var(--brand); color: var(--brand-2); }
  .opt .opt-play.is-playing { border-color: var(--brand); color: var(--brand); }
  .opt.right { border-color: var(--ok); background: rgba(78,203,109,.13); animation: pop .28s var(--ease); }
  .opt.wrong { border-color: var(--bad); background: rgba(255,115,100,.09); }
  .opt.faded { opacity: .22; pointer-events: none; }
  .opt .zh {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 8px;
    background: linear-gradient(180deg, transparent, rgba(8,9,12,.88));
    font-size: 12.5px; text-align: center;
  }
  @keyframes pop { 0% { transform: scale(.97); } 60% { transform: scale(1.015); } 100% { transform: scale(1); } }

  /* ---------- 反馈条（非课堂页用；课堂反馈在 Dock） ---------- */
  .fb {
    margin-top: 12px; padding: 13px 15px; border-radius: var(--r-m);
    border: 1px solid var(--line); border-left: 3px solid var(--brand);
    background: var(--card2); font-size: 14px;
  }
  .fb.ok { border-left-color: var(--ok); }
  .fb.bad { border-left-color: var(--bad); }
  .fb .tutor { color: var(--dim); font-size: 13px; margin-top: 6px; min-height: 18px; }

  /* ---------- 表格 / chips / 报告 ---------- */
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .tbl th { text-align: right; font-weight: 600; color: var(--dim); font-size: 12px; padding: 4px 8px; }
  .tbl th:first-child { text-align: left; }
  .tbl td { text-align: right; padding: 5px 8px; border-top: 1px solid var(--line); }
  .tbl td:first-child { text-align: left; color: var(--dim); }
  .tbl td.ok { color: var(--ok); }
  .tbl td.bad { color: var(--warn); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
          background: var(--card2); border: 1px solid var(--line-2); }
  .chip.ok { border-color: rgba(78,203,109,.45); color: var(--ok); }
  .chip.bad { border-color: rgba(255,115,100,.45); color: var(--bad); }

  pre.report { white-space: pre-wrap; font: 15px/1.9 var(--font); margin: 0; }

  /* ---------- 清单勾选 ---------- */
  .grp-head { display: flex; justify-content: space-between; align-items: baseline;
              margin: 22px 0 9px; }
  .grp-head > span { font-size: 16px; font-weight: 800; }
  .grp-head .dim { font-size: 12px; margin-left: 2px; }
  .zh3 { font-size: 14px; }
  .words.q { color: var(--faint); }

  .wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .wcard {
    position: relative; padding: 10px 12px; border-radius: var(--r-m); cursor: pointer;
    background: var(--card); border: 1.5px solid var(--line);
    transition: border-color .12s, background .12s, transform .12s;
  }
  .wcard:hover { border-color: rgba(232,169,75,.4); transform: translateY(-1px); }
  .wcard.on { background: rgba(232,169,75,.1); border-color: rgba(232,169,75,.6); }
  .wcard .wtop { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .wcard .lemma { font-size: 16px; font-weight: 800; letter-spacing: .01em; }
  .wcard.on .lemma { color: var(--brand-2); }
  .wcard .zh2 { font-size: 12px; color: var(--dim); margin-top: 1px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wcard .spk { display: inline-flex; opacity: .45; padding: 3px 5px; color: var(--fg); }
  .wcard .spk .ic { width: 15px; height: 15px; }
  .wcard .spk:hover { opacity: 1; color: var(--brand-2); }
  .wcard .tick { position: absolute; right: 9px; bottom: 6px; color: var(--brand);
                 font-size: 13px; font-weight: 800; opacity: 0; transition: .1s; }
  .wcard.on .tick { opacity: 1; }

  /* 固定在视口底部，不参与文档流 —— sticky 在长列表里会压住内容 */
  .sticky {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
    width: 100%; max-width: 520px; padding: 14px 16px 16px;
    background: rgba(15,17,21,.88); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line); z-index: 10;
  }

  /* ---------- 课程表 / 用户行 ---------- */
  .lesson {
    display: flex; gap: 12px; align-items: center; padding: 13px 14px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-m); margin-bottom: 8px; cursor: pointer;
    transition: border-color .14s, transform .14s;
    animation: rise .28s var(--ease) both;
  }
  .lesson:hover { border-color: rgba(232,169,75,.5); transform: translateX(2px); }
  .lesson .n {
    width: 38px; height: 38px; flex: none; border-radius: 12px;
    background: var(--card2); border: 1px solid var(--line-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .lesson.done .n { background: rgba(78,203,109,.12); border-color: rgba(78,203,109,.4); color: var(--ok); }
  .lesson .body { flex: 1; min-width: 0; }
  .lesson .theme { font-weight: 800; margin-bottom: 2px; }
  .lesson .words { font-size: 12px; color: var(--dim);
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lesson.cur { border-color: rgba(232,169,75,.55); }
  .lesson .resume-hint { font-size: 12px; color: var(--brand-2); font-weight: 700; }
  .lesson .resume-hint::before { content: '▸ '; }
  /* 用户行的序号圆片改成头像 */
  .lesson.user .n {
    border-radius: 50%; border: none;
    background: linear-gradient(135deg, var(--brand-2), var(--brand)); color: var(--brand-ink);
  }

  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line-2);
          border-top-color: var(--brand); border-radius: 50%; animation: s .7s linear infinite;
          vertical-align: -2px; }
  @keyframes s { to { transform: rotate(360deg) } }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: rgba(36,40,50,.95); backdrop-filter: blur(10px);
    border: 1px solid var(--line-2); padding: 10px 18px; z-index: 100;
    border-radius: 999px; opacity: 0; transition: .2s; pointer-events: none;
    font-size: 14px; font-weight: 600;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============================================================
     上课页：横屏课堂（只影响 S.view === 'card'）
     框架恒定：顶栏 → 进度条 → Stage（卡型填）→ Dock（提示/反馈/主行动）
     ============================================================ */
  body.classing {
    background:
      radial-gradient(900px 420px at 50% -160px, rgba(232,169,75,.07), transparent 60%),
      var(--bg-2);
  }
  body.classing #app {
    max-width: none;
    width: 100%;
    padding: 0;
    min-height: 100dvh;
    display: flex;
  }

  .lesson-stage {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 顶栏：退出 / 课名+环节 / 成绩+静音 */
  .cls-top {
    flex: none;
    display: flex; align-items: center; gap: 14px;
    padding: 12px clamp(16px, 3vw, 40px) 8px;
  }
  .exit-btn {
    flex: none; height: 38px; padding: 0 15px 0 11px; gap: 3px;
    border-radius: 999px; color: var(--dim); font-size: 13px; font-weight: 700;
  }
  .exit-btn:hover:not(:disabled) { color: var(--fg); }
  .exit-btn .ic { width: 15px; height: 15px; }
  .cls-title { flex: 1; min-width: 0; }
  .cls-lesson {
    font-weight: 800; font-size: clamp(15px, 1.6vw, 18px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cls-seg { color: var(--dim); font-size: clamp(11px, 1.1vw, 13px); margin-top: 1px; }
  .cls-right { display: flex; align-items: center; gap: 12px; flex: none; }
  .cls-stats { display: flex; gap: 10px; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .cls-stats .ok { color: var(--ok); }
  .cls-stats .bad { color: var(--bad); }
  .icon-btn { flex: none; width: 38px; height: 38px; padding: 0; border-radius: 12px; }

  /* 进度条：卡片进度一根细条，环节结构收进顶栏文案 */
  .cls-progress {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 2px clamp(16px, 3vw, 40px) 12px;
  }
  .cls-bar { flex: 1; height: 6px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
  .cls-bar > i {
    display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--brand), var(--brand-2));
    transition: width .3s var(--ease);
  }
  .cls-count { font-size: 12px; font-weight: 800; color: var(--faint); font-variant-numeric: tabular-nums; }

  /* Stage：内容槽。split = 左教具右作答；solo 卡居中限宽 */
  .cls-stage {
    flex: 1; min-height: 0; width: 100%;
    max-width: 1240px; margin: 0 auto;
    padding: 4px clamp(16px, 3vw, 40px) 16px;
    display: grid;
  }
  .stage-split {
    min-height: 0; display: grid;
    grid-template-columns: minmax(300px, 5fr) minmax(380px, 7fr);
    gap: clamp(12px, 2vw, 24px);
  }
  .stage-solo-card { width: min(780px, 100%); justify-self: center; }

  .panel {
    position: relative;
    min-height: 0; display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l);
    padding: clamp(16px, 2vw, 26px);
    box-shadow: 0 12px 40px rgba(0,0,0,.3);
    overflow: hidden;
  }
  .panel-tag {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    font-size: 11px; font-weight: 800; letter-spacing: .1em;
    color: var(--dim); background: rgba(15,17,21,.75); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
  }
  .bonus-chip {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    font-size: 11px; font-weight: 800; letter-spacing: .08em;
    color: var(--brand-2); background: rgba(232,169,75,.12);
    border: 1px solid rgba(232,169,75,.35); border-radius: 999px; padding: 3px 10px;
  }

  .panel-media {
    flex: 1; min-height: 0; display: grid; place-items: center;
    border-radius: var(--r-m); overflow: hidden;
    background: #101218; border: 1px solid var(--line); margin-bottom: 14px;
  }
  .panel-media img { width: 100%; height: 100%; object-fit: contain; }
  .prompt-echo {
    display: grid; place-items: center; width: 100%; height: 100%;
    color: rgba(232,169,75,.45);
  }
  .prompt-echo .ic { width: clamp(52px, 7vw, 88px); height: auto; }
  .prompt-meaning {
    text-align: center; font-size: clamp(17px, 2vw, 24px); font-weight: 800;
    margin-bottom: 14px; line-height: 1.5;
  }
  .prompt-actions { display: flex; gap: 10px; }
  .prompt-actions.center { justify-content: center; }
  .prompt-actions .play { flex: 2; padding: 15px 18px; }
  .prompt-actions .play.small { flex: 1; }

  .answer-panel .grid { flex: 1; min-height: 0; grid-auto-rows: 1fr; }
  .answer-panel .grid .opt { height: 100%; min-height: 96px; }
  .answer-panel .olist { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .answer-panel .olist .opt {
    flex: 1; min-height: 56px; padding: 14px 18px; justify-content: flex-start;
    text-align: left; gap: 10px; font-size: clamp(14px, 1.5vw, 17px);
  }
  .answer-panel .olist .opt .opt-en {
    margin-left: auto; font-size: 12px; color: var(--dim); text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%;
  }

  /* Dock：恒定底部区。未答 = 提示；已答 = 反馈 + 继续；动作卡 = 主按钮 */
  .cls-dock {
    flex: none; display: flex; align-items: center; gap: 18px;
    min-height: 92px; padding: 14px clamp(16px, 3vw, 40px);
    border-top: 1px solid var(--line);
    background: rgba(15,17,21,.85); backdrop-filter: blur(10px);
    transition: background .25s, border-color .25s;
  }
  .cls-dock.ok { background: rgba(78,203,109,.13); border-top-color: rgba(78,203,109,.35); }
  .cls-dock.bad { background: rgba(255,115,100,.11); border-top-color: rgba(255,115,100,.35); }
  .dock-hint { flex: 1; text-align: center; color: var(--faint); font-size: 13.5px; }
  .dock-fb { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 12px;
             animation: dockIn .24s var(--ease); }
  .dock-fb-icon {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
  }
  .dock-fb-icon .ic { width: 18px; height: 18px; }
  .cls-dock.ok .dock-fb-icon { background: var(--ok); color: var(--ok-ink); }
  .cls-dock.bad .dock-fb-icon { background: var(--bad); color: var(--bad-ink); }
  .dock-fb-body { min-width: 0; }
  .dock-fb-title { font-weight: 800; font-size: 14px; }
  .cls-dock.ok .dock-fb-title { color: var(--ok); }
  .cls-dock.bad .dock-fb-title { color: var(--bad); }
  .dock-fb-line { font-size: 14px; margin-top: 1px; }
  .dock-fb-tutor { color: var(--dim); font-size: 13px; margin-top: 3px; min-height: 18px; }
  .dock-next { flex: none; min-width: 150px; padding: 14px 22px; font-size: 15px; }
  .dock-actions { flex: 1; display: flex; gap: 12px; justify-content: flex-end; }
  .dock-actions .big { padding: 14px 22px; font-size: 15px; }
  @keyframes dockIn { from { opacity: 0; transform: translateY(10px); } }

  /* 跟读 / 中场 / 盲听等 solo 卡 */
  .stage-solo-card { text-align: center; align-items: center; }
  .shadow-layout {
    width: 100%; flex: 1; min-height: 0;
    display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    gap: 20px; margin-bottom: 14px;
  }
  .shadow-media {
    min-height: 150px; border-radius: var(--r-m); overflow: hidden;
    background: #101218; border: 1px solid var(--line); display: grid; place-items: center;
  }
  .shadow-media img { width: 100%; height: 100%; object-fit: contain; }
  .shadow-target { display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 8px; }
  .shadow-text { font-size: clamp(20px, 2.8vw, 34px); font-weight: 800; line-height: 1.35; margin-bottom: 6px; }
  .shadow-note { color: var(--faint); margin: 12px 0 0; font-size: 13px; }
  .lead { font-size: clamp(15px, 1.7vw, 19px); color: var(--dim); font-weight: 600; }

  .report-card { text-align: center; justify-content: center; align-items: center; gap: 12px; }
  .report-card .big-emoji { color: var(--brand); display: flex; }
  .report-card .big-emoji .ic { width: 56px; height: 56px; }
  .report-card h2 {
    display: block; font-size: 22px; font-weight: 800; color: var(--fg);
    letter-spacing: 0; text-transform: none; margin: 0;
  }
  .report-card h2::after { content: none; }

  /* 竖屏触屏设备：给出课程惯用的旋转提示 */
  .rotate-guard { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    .rotate-guard {
      position: absolute; inset: 0; z-index: 30; display: grid; place-items: center;
      background: var(--bg-2); text-align: center; padding: 24px;
    }
    .rotate-guard .rotate-ico { color: var(--brand); animation: rotate-hint 2.4s ease-in-out infinite; }
    .rotate-guard .rotate-ico .ic { width: 52px; height: 52px; }
    .rotate-guard .rotate-title { font-size: 20px; font-weight: 800; margin-top: 16px; }
    .rotate-guard .rotate-sub { color: var(--dim); margin-top: 6px; }
  }
  @keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    35% { transform: rotate(90deg); }
    65% { transform: rotate(90deg); }
  }

  /* 窄横屏（手机横放）退化为可滚动单栏；iPad 及以上保持双栏课堂 */
  @media (max-width: 760px) {
    .cls-stage { overflow-y: auto; }
    .stage-split { grid-template-columns: 1fr; }
    .answer-panel .grid .opt { min-height: 88px; }
  }

  /* 小横屏（手机横放）压紧一点，仍保持双栏课堂 */
  @media (max-height: 520px) {
    .cls-top { padding-top: 8px; }
    .cls-progress { padding-bottom: 8px; }
    .cls-stage { padding-bottom: 10px; }
    .panel { padding: 12px; border-radius: var(--r-m); }
    .cls-dock { min-height: 72px; padding-top: 10px; padding-bottom: 10px; }
    .answer-panel .grid .opt { min-height: 72px; }
    .prompt-echo .ic { width: 42px; }
  }

</style>
</head>
