<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%235b8cff'/><text x='16' y='22' text-anchor='middle' font-size='17' fill='white' font-family='Arial'>A</text></svg>">
<title>AIlesson · Muddy Puddles</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card2: #21252e;
    --line: #2c313c;
    --fg: #e8eaed;
    --dim: #9aa0ac;
    --accent: #5b8cff;
    --ok: #34c759;
    --bad: #ff5f56;
    --warn: #ffb340;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; justify-content: center; min-height: 100vh;
  }
  #app { width: 100%; max-width: 480px; padding: 16px 16px 40px; }
body.checking #app { padding-bottom: 120px; }   /* 给底部固定条留位，别压住词卡 */

  h1 { font-size: 20px; margin: 4px 0 2px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .dim { color: var(--dim); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }

  button {
    font: inherit; color: var(--fg); background: var(--card2);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 16px; cursor: pointer; transition: .12s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  button.wide { width: 100%; }
  button.ghost { background: transparent; }
  button.big { padding: 16px; font-size: 16px; }

  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 14px; padding: 16px; margin-bottom: 12px; }

  /* 顶部进度 */
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 10px 0 14px; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }

  .seg { font-size: 12px; color: var(--dim); letter-spacing: .3px; }
  .seg b { color: var(--accent); font-weight: 600; }

  /* 播音按钮 */
  .play {
    width: 100%; padding: 26px; font-size: 17px; font-weight: 600;
    background: linear-gradient(180deg, #2b3242, #232833);
    border: 1px solid var(--line); border-radius: 14px;
  }
  .play.small { padding: 14px; font-size: 15px; }
  .play.is-playing { border-color: var(--accent); background: #2a3550; }

  /* 选项网格 */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .opt {
    position: relative; padding: 0; overflow: hidden; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    background: var(--card2); border: 2px solid var(--line); border-radius: 12px;
  }
  .opt img { width: 100%; height: 100%; object-fit: cover; }
  .opt.audio { aspect-ratio: auto; padding: 20px 12px; font-size: 14px; }
  .opt.right { border-color: var(--ok); }
  .opt.wrong { border-color: var(--bad); opacity: .6; }
  .opt.faded { opacity: .25; pointer-events: none; }
  .opt .zh {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 4px;
    background: rgba(0,0,0,.72); font-size: 12px;
  }

  /* 反馈条 */
  .fb { margin-top: 12px; padding: 12px 14px; border-radius: 10px;
        border-left: 3px solid var(--line); background: var(--card2); font-size: 14px; }
  .fb.ok { border-left-color: var(--ok); }
  .fb.bad { border-left-color: var(--bad); }
  .fb .tutor { color: var(--dim); font-size: 13px; margin-top: 6px; min-height: 18px; }

  /* 用户 */
  .ubar { display: flex; justify-content: space-between; align-items: center;
          padding: 8px 12px; margin-bottom: 12px; border-radius: 10px;
          background: var(--card); border: 1px solid var(--line); font-size: 13px; }
  .ubar .who { font-weight: 600; }
  .lesson.cur { border-color: var(--accent); }
  button.danger { color: var(--bad); border-color: #4a2a2a; }
  button.danger:hover { border-color: var(--bad); }
  .inp { flex: 1; font: inherit; color: var(--fg); background: var(--card2);
         border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; }
  .inp:focus { outline: none; border-color: var(--accent); }

  /* 三层切页 */
  .tabs { display: flex; gap: 6px; margin: 14px 0 4px; }
  .tab { flex: 1; padding: 9px 6px; font-size: 14px; border-radius: 10px;
         display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tab.on { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .tab .cnt { font-size: 11px; opacity: .75; }

  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: right; font-weight: 500; color: var(--dim);
            font-size: 12px; padding: 2px 8px; }
  .tbl th:first-child { text-align: left; }
  .tbl td { text-align: right; padding: 3px 8px; }
  .tbl td:first-child { text-align: left; color: var(--dim); }
  .tbl td.ok { color: var(--ok); }
  .tbl td.bad { color: var(--warn); }

  /* 清单勾选 */
  .grp-head { display: flex; justify-content: space-between; align-items: center;
              margin: 18px 0 8px; font-weight: 600; font-size: 14px; }
  .wlist { display: flex; flex-direction: column; gap: 8px; }
  .lemma.sm { font-size: 14px; font-weight: 500; line-height: 1.4; }
  .olist { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .opt.text { aspect-ratio: auto; padding: 13px 14px; text-align: left;
              justify-content: flex-start; }
  .zh3 { font-size: 14px; }
  .words.q { color: #8d94a3; }
  button.mini { padding: 4px 10px; font-size: 12px; border-radius: 14px; }
  .wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .wcard {
    position: relative; padding: 10px 12px; border-radius: 10px; cursor: pointer;
    background: var(--card); border: 1.5px solid var(--line); transition: .1s;
  }
  .wcard:hover { border-color: #414958; }
  .wcard.on { background: #17301f; border-color: var(--ok); }
  .wcard .wtop { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .wcard .lemma { font-size: 16px; font-weight: 600; letter-spacing: .2px; }
  .wcard.on .lemma { color: var(--ok); }
  .wcard .zh2 { font-size: 12px; color: var(--dim); margin-top: 1px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wcard .spk { font-size: 14px; opacity: .5; padding: 2px 4px; }
  .wcard .spk:hover { opacity: 1; }
  .wcard .tick { position: absolute; right: 8px; bottom: 6px; color: var(--ok);
                 font-size: 13px; opacity: 0; transition: .1s; }
  .wcard.on .tick { opacity: 1; }

  /* 固定在视口底部，不参与文档流 —— sticky 在长列表里会压住内容 */
  .sticky {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
    width: 100%; max-width: 480px; padding: 14px 16px 16px;
    background: var(--bg); border-top: 1px solid var(--line); z-index: 10;
  }

  /* 课程列表 */
  .lesson { display: flex; gap: 10px; align-items: center; padding: 12px;
            background: var(--card2); border: 1px solid var(--line);
            border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
  .lesson:hover { border-color: var(--accent); }
  .lesson .n { width: 30px; height: 30px; flex: none; border-radius: 50%;
               background: var(--line); display: flex; align-items: center;
               justify-content: center; font-size: 13px; font-weight: 600; }
  .lesson.done .n { background: var(--ok); }
  .lesson .body { flex: 1; min-width: 0; }
  .lesson .theme { font-weight: 600; margin-bottom: 2px; }
  .lesson .words { font-size: 12px; color: var(--dim);
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 20px;
          background: var(--card2); border: 1px solid var(--line); }
  .chip.ok { border-color: var(--ok); color: var(--ok); }
  .chip.bad { border-color: var(--bad); color: var(--bad); }

  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line);
          border-top-color: var(--accent); border-radius: 50%; animation: s .7s linear infinite;
          vertical-align: -2px; }
  @keyframes s { to { transform: rotate(360deg) } }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
           background: #2b3242; border: 1px solid var(--line); padding: 10px 18px;
           border-radius: 22px; opacity: 0; transition: .2s; pointer-events: none; font-size: 14px; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  pre.report { white-space: pre-wrap; font: inherit; margin: 0; }

  /* ============================================================
     上课页：横屏 iPad 课堂布局（只影响 S.view === 'card'）
     其他页面维持原 480px 手机清单布局不变。
     ============================================================ */
  body.classing {
    background:
      radial-gradient(1100px 520px at 50% -180px, rgba(91,140,255,.16), transparent 62%),
      linear-gradient(180deg, #0c111c 0%, #070a11 100%);
  }
  body.classing #app {
    max-width: none;
    width: 100%;
    padding: 0;
    min-height: 100dvh;
    display: flex;
  }

  .lesson-stage {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 顶部：身份条 + 环节 + 成绩 + 静音/退出 */
  .lesson-top {
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.4vw, 18px);
    padding: 14px clamp(16px, 3vw, 42px) 12px;
    border-bottom: 1px solid rgba(255,255,255,.07);
    background: rgba(10,14,22,.72);
    backdrop-filter: blur(8px);
  }
  .lesson-top .lesson-head { flex: 1; min-width: 0; }
  .lesson-title {
    font-size: clamp(15px, 1.7vw, 22px);
    font-weight: 700; letter-spacing: .2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lesson-seg { color: var(--dim); font-size: clamp(11px, 1.15vw, 14px); margin-top: 2px; }
  .lesson-seg b { color: #9db9ff; font-weight: 600; }
  .lesson-head-right { display: flex; align-items: center; gap: 8px; flex: none; }
  .score-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: 999px; font-size: 13px;
    background: var(--card); border: 1px solid var(--line); white-space: nowrap;
  }
  .score-pill .ok { color: var(--ok); font-weight: 600; }
  .score-pill .bad { color: var(--bad); font-weight: 600; }
  .lesson-top button.icon-btn {
    flex: none; width: 38px; height: 38px; padding: 0; border-radius: 12px;
    font-size: 17px; line-height: 1;
  }
  .lesson-top button.exit-btn {
    width: auto; padding: 0 14px; font-size: 13px; color: var(--dim);
  }

  /* 16 环节进度轨 + 卡片进度条 */
  .lesson-progress {
    padding: 10px clamp(16px, 3vw, 42px) 0;
    border-bottom: 1px solid rgba(255,255,255,.05);
    background: rgba(10,14,22,.45);
  }
  .seg-rail { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .seg-rail::-webkit-scrollbar { display: none; }
  .seg-pill {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 999px; font-size: 12px;
    background: var(--card); border: 1px solid var(--line); color: var(--dim);
    transition: .15s;
  }
  .seg-pill .seg-n {
    width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center;
    background: var(--line); color: #c6cdd9; font-size: 10px; font-weight: 700;
  }
  .seg-pill.done { color: #b8e6c4; border-color: rgba(52,199,89,.35); }
  .seg-pill.done .seg-n { background: var(--ok); color: #06130a; }
  .seg-pill.cur {
    color: #fff; border-color: var(--accent);
    background: linear-gradient(180deg, #3452a8, #2649a8);
  }
  .seg-pill.cur .seg-n { background: #fff; color: var(--accent); }
  .bar-row {
    display: flex; align-items: center; gap: 12px;
    padding: 0 0 10px; font-size: 12px; color: var(--dim);
  }
  .bar-row .bar { flex: 1; margin: 0; height: 5px; }
  .bar-row .bar > i { border-radius: 2px; }

  /* 主区：左教具 / 右作答 */
  .lesson-main {
    flex: 1; min-height: 0; width: 100%;
    max-width: 1460px; margin: 0 auto;
    display: grid; grid-template-columns: minmax(300px, 5fr) minmax(380px, 7fr);
    gap: clamp(12px, 2vw, 26px);
    padding: clamp(12px, 2.4vw, 34px) clamp(16px, 3vw, 42px);
  }
  .lesson-main.single { grid-template-columns: minmax(0, 820px); justify-content: center; }

  .panel-card {
    min-height: 0; display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(26,31,42,.92), rgba(19,23,31,.92));
    border: 1px solid rgba(255,255,255,.08); border-radius: 20px;
    padding: clamp(16px, 2.2vw, 28px);
    box-shadow: 0 20px 60px rgba(0,0,0,.28);
    overflow: hidden;
  }
  .panel-label {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    color: var(--dim); font-size: 12px; letter-spacing: 1px; margin-bottom: 12px;
  }
  .panel-label b { color: #cdd8ff; font-size: 13px; letter-spacing: .3px; }

  .prompt-card { justify-content: center; }
  .prompt-media {
    flex: 1; min-height: 0; display: grid; place-items: center;
    border-radius: 14px; overflow: hidden;
    background: #10141d; border: 1px solid var(--line); margin-bottom: 14px;
  }
  .prompt-media img { width: 100%; height: 100%; object-fit: contain; }
  .prompt-echo {
    display: grid; place-items: center; width: 100%; height: 100%;
    font-size: clamp(46px, 8vw, 96px); color: #3d4f7a;
  }
  .prompt-meaning {
    text-align: center; font-size: clamp(17px, 2.2vw, 26px); font-weight: 600;
    margin-bottom: 14px; line-height: 1.5;
  }
  .prompt-actions { display: flex; gap: 10px; }
  .prompt-actions.center { justify-content: center; }
  .prompt-actions .play { flex: 2; padding: 16px 18px; }
  .prompt-actions .play.small { flex: 1; }

  .answer-card { }
  .answer-card .olist, .answer-card .grid { flex: 1; min-height: 0; }
  .answer-card .grid { grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 12px; }
  .answer-card .grid .opt { aspect-ratio: auto; height: 100%; min-height: 108px; border-radius: 14px; }
  .answer-card .olist { gap: 10px; }
  .answer-card .olist .opt {
    flex: 1; min-height: 58px; padding: 15px 18px; border-radius: 13px;
    font-size: clamp(14px, 1.5vw, 17px); text-align: left;
    display: flex; align-items: center; gap: 10px;
  }
  .answer-card .olist .opt .opt-en {
    margin-left: auto; font-size: 12px; color: var(--dim); text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%;
  }
  .answer-card .opt .zh { font-size: 13px; }

  .fb { margin-top: 14px; }
  .fb.lg { padding: 14px 16px; border-radius: 12px; }
  .lesson-actions { display: flex; gap: 12px; margin-top: 16px; }
  .lesson-actions .big { flex: 1; padding: 15px 18px; font-size: 16px; }
  .answer-hint { margin-top: 12px; color: var(--dim); font-size: 13px; text-align: center; }

  .shadow-layout {
    flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    gap: 20px; margin-bottom: 14px;
  }
  .shadow-media {
    min-height: 160px; border-radius: 14px; overflow: hidden;
    background: #10141d; border: 1px solid var(--line); display: grid; place-items: center;
  }
  .shadow-media img { width: 100%; height: 100%; object-fit: contain; }
  .shadow-target { display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 10px; }
  .shadow-text {
    font-size: clamp(20px, 3.2vw, 40px); font-weight: 700; line-height: 1.4; margin-bottom: 8px;
  }
  .shadow-note { text-align: center; color: var(--dim); margin: 14px 0; font-size: 14px; }

  .single-card { width: 100%; }
  .single-card .lead { text-align: center; font-size: clamp(15px, 1.8vw, 19px); color: #c6cdd9; }
  .self-grid { display: flex; gap: 12px; margin-top: 18px; }
  .self-grid button { flex: 1; padding: 16px 10px; font-size: 15px; }

  .report-card { text-align: center; justify-content: center; gap: 14px; }
  .report-card .big-emoji { font-size: 56px; }

  /* 竖屏触屏设备：给出课程惯用的旋转提示 */
  .rotate-guard { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    .rotate-guard {
      position: absolute; inset: 0; z-index: 30; display: grid; place-items: center;
      background: #080c14; text-align: center; padding: 24px;
    }
    .rotate-guard .rotate-ico { font-size: 46px; animation: rotate-hint 2.4s ease-in-out infinite; }
    .rotate-guard .rotate-title { font-size: 20px; font-weight: 700; margin-top: 14px; }
    .rotate-guard .rotate-sub { color: var(--dim); margin-top: 6px; }
  }
  @keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    35% { transform: rotate(90deg); }
    65% { transform: rotate(90deg); }
  }

  /* 窄横屏（手机横放）退化为可滚动单栏；iPad 及以上保持双栏课堂 */
  @media (max-width: 760px) {
    .lesson-main {
      grid-template-columns: 1fr;
      overflow-y: auto;
    }
    .lesson-main.single { grid-template-columns: 1fr; }
    .answer-card .grid .opt { min-height: 92px; }
  }

  /* 小横屏（手机横放）压紧一点，仍保持双栏课堂 */
  @media (max-height: 520px) {
    .lesson-top { padding-top: 8px; padding-bottom: 8px; }
    .lesson-progress { padding-top: 6px; }
    .seg-rail { padding-bottom: 6px; }
    .lesson-main { gap: 10px; padding: 10px 14px; }
    .panel-card { padding: 12px; border-radius: 14px; }
    .answer-card .grid { gap: 8px; }
    .answer-card .grid .opt { min-height: 76px; }
    .prompt-echo { font-size: 42px; }
  }

</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<audio id="au"></audio>
<script src="/app.js"></script>
</body>
</html>
